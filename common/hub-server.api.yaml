openapi: 3.0.0
info:
  title: Dataset Feature Management API
  version: 1.0.0
  description: API for managing features, revisions, executions, and results for datasets

servers:
  - url: https://api.example.com/v1

paths:
  /dataset/{dataset_id}/features:
    get:
      summary: List all features for a dataset
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: string
          example: title_pages
        - name: expand
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated list of fields to expand (latest_revision, revisions)
          example: latest_revision,revisions
      responses:
        '200':
          description: List of features
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Feature'

    post:
      summary: Create a new feature
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureInput'
      responses:
        '201':
          description: Feature created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feature'

  /dataset/{dataset_id}/features/{feature_id}:
    get:
      summary: Get a specific feature
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: string
        - name: feature_id
          in: path
          required: true
          schema:
            type: string
          example: fea_ts8621
        - name: expand
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated list of fields to expand (latest_revision, revisions)
      responses:
        '200':
          description: Feature details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feature'

    put:
      summary: Update a feature
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: string
        - name: feature_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureInput'
      responses:
        '200':
          description: Feature updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feature'

    delete:
      summary: Delete a feature
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: string
        - name: feature_id
          in: path
          required: true
          schema:
            type: string
        - name: force
          in: query
          required: false
          schema:
            type: boolean
          description: If true, delete is performed even if there are results
      responses:
        '204':
          description: Feature deleted

  /dataset/{dataset_id}/features/{feature_id}/revisions:
    get:
      summary: List all revisions for a feature
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: string
        - name: feature_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of revisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeatureRevision'

    post:
      summary: Create a new revision for a feature
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: string
        - name: feature_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureRevisionInput'
      responses:
        '201':
          description: Revision created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureRevision'

  /dataset/{dataset_id}/features/{feature_id}/revisions/{revision_id}:
    get:
      summary: Get a specific revision
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: string
        - name: feature_id
          in: path
          required: true
          schema:
            type: string
        - name: revision_id
          in: path
          required: true
          schema:
            type: string
          example: rev_5
      responses:
        '200':
          description: Revision details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureRevision'

  /executions:
    get:
      summary: List executions with optional filters
      parameters:
        - name: dataset
          in: query
          required: false
          schema:
            type: string
          example: title_pages
        - name: features
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated list of feature IDs
          example: fea_67gf89,fea_98hd76
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated list of statuses
          example: success,in_progress
      responses:
        '200':
          description: List of executions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Execution'

    post:
      summary: Create a new execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionInput'
      responses:
        '201':
          description: Execution created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'

  /executions/{execution_id}:
    get:
      summary: Get a specific execution
      parameters:
        - name: execution_id
          in: path
          required: true
          schema:
            type: string
          example: exe_5
      responses:
        '200':
          description: Execution details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'

  /executions/{execution_id}/cancel:
    put:
      summary: Cancel an execution
      parameters:
        - name: execution_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Execution cancellation initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'

  /results/{key}:
    get:
      summary: Get results for a specific key
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          example: Paris_1667
        - name: features
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated list of feature IDs
          example: fea_67gf89,fea_98hd76
      responses:
        '200':
          description: Results for the key
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Result'

    post:
      summary: Create or update results for a key
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultInput'
      responses:
        '201':
          description: Result created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /dataset/{dataset_id}/tei:
    get:
      summary: Get TEI XML view
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: query
          required: true
          schema:
            type: string
          example: Paris_1667
        - name: features
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated list of feature IDs
          example: feature1,feature2
      responses:
        '200':
          description: TEI XML representation
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

components:
  schemas:
    Feature:
      type: object
      properties:
        id:
          type: string
          example: fea_ts8621
        name:
          type: string
          example: institutions
        description:
          type: string
          example: user facing description
        is_root:
          type: boolean
          description: Immutable flag indicating if this is a root feature
        is_default:
          type: boolean
          description: Whether this feature should be used by default
        created_at:
          type: string
          format: date-time
          example: '2024-06-20T12:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2024-06-20T12:00:00Z'
        latest_revision:
          $ref: '#/components/schemas/FeatureRevision'
          description: Only included if expand=latest_revision
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/FeatureRevision'
          description: Only included if expand=revisions

    FeatureInput:
      type: object
      required:
        - name
        - is_root
      properties:
        name:
          type: string
        description:
          type: string
        is_root:
          type: boolean
        is_default:
          type: boolean

    FeatureRevision:
      type: object
      properties:
        id:
          type: string
          example: rev_5
        prompt:
          type: string
          example: Extract all the institutions mentioned in the ...
        regex:
          type: string
          example: .+jes.*
        execution_strategy:
          type: string
          enum: [prompt, regex]
        note:
          type: string
          example: Adding the blah blah to try to fix blah blah..
        type:
          type: string
          enum: [annotation, ner]
        features:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: fea_1676g6
          description: Only if the parent feature is root. All child features must NOT be root.
        created_at:
          type: string
          format: date-time
          example: '2023-10-10T12:00:00Z'

    FeatureRevisionInput:
      type: object
      required:
        - execution_strategy
        - type
      properties:
        prompt:
          type: string
        regex:
          type: string
        execution_strategy:
          type: string
          enum: [prompt, regex]
        note:
          type: string
        type:
          type: string
          enum: [annotation, ner]
        features:
          type: array
          items:
            type: object
            properties:
              id:
                type: string

    Execution:
      type: object
      properties:
        id:
          type: string
          example: exe_5
        created_at:
          type: string
          format: date-time
          example: '2023-10-10T12:00:00Z'
        completed_at:
          type: string
          format: date-time
          example: '2023-10-10T12:00:00Z'
        dataset:
          type: string
          example: title_pages
        keys:
          type: array
          items:
            type: string
          example: [Paris_1667, London_1667]
          description: If not provided, run on all keys
        apply:
          type: array
          items:
            type: object
            properties:
              feature:
                type: string
                example: fea_67gf89
              revision:
                type: string
                example: rev_5
                description: If not provided, using latest
        policy:
          type: object
          properties:
            skip_if:
              type: array
              items:
                type: string
                enum: [feature_exist, revision_exist, human_reviewed]
        status:
          type: string
          enum: [success, failed, in_progress, canceling, canceled]

    ExecutionInput:
      type: object
      required:
        - dataset
        - apply
      properties:
        dataset:
          type: string
        keys:
          type: array
          items:
            type: string
        apply:
          type: array
          items:
            type: object
            properties:
              feature:
                type: string
              revision:
                type: string
        policy:
          type: object
          properties:
            skip_if:
              type: array
              items:
                type: string

    Result:
      type: object
      properties:
        feature:
          type: string
          example: fea_23dr5d
        source:
          type: object
          properties:
            resp:
              type: string
              enum: [automatic, human]
            id:
              type: string
              example: exec-45fg5d
            revision:
              type: string
              example: rev-5
            name:
              type: string
              example: MiaMish
        values:
          type: array
          items:
            type: object
            properties:
              root:
                type: string
                example: græco
              childrens:
                type: array
                items:
                  type: object
                  properties:
                    feature:
                      type: string
                      example: fea_6i09z
                    source:
                      type: object
                      properties:
                        resp:
                          type: string
                        name:
                          type: string
                        id:
                          type: string
                        revision:
                          type: string
                    values:
                      type: array
                      items:
                        type: object
                        properties:
                          root:
                            type: string
                    note:
                      type: string
        note:
          type: string
          example: Corrected OCR confusion

    ResultInput:
      type: object
      required:
        - feature
        - source
        - values
      properties:
        feature:
          type: string
        source:
          type: object
          properties:
            resp:
              type: string
            id:
              type: string
            revision:
              type: string
            name:
              type: string
        values:
          type: array
          items:
            type: object
        note:
          type: string
